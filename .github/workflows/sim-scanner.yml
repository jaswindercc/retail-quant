name: Google Sheet Sync to SIM

on:
  schedule:
    - cron: '5 20 * * 1-5'  # Mon-Fri 4:05 PM EDT
  workflow_dispatch:

permissions:
  actions: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance lxml html5lib

      - name: Run simulator
        run: python scripts/generate_sim_data.py

      - name: Cache sim data
        uses: actions/cache/save@v4
        with:
          path: dashboard/public/sim_data.json
          key: sim-data
