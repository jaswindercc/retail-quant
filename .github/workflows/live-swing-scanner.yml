name: Live Swing Scanner

on:
  schedule:
    - cron: '0 20 * * 1-5'  # Mon-Fri 4:00 PM EDT
  workflow_dispatch:

permissions:
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance lxml html5lib

      - name: Build stock universe
        run: python scripts/build_universe.py

      - name: Run live scanner
        run: python scripts/scan_live.py --universe universe --lookback 3 --hh-lookback 30

      - name: Copy to dashboard public
        run: cp data/live_scanner_data.json dashboard/public/live_scanner_data.json

      - name: Cache live scanner data
        uses: actions/cache/save@v4
        with:
          path: dashboard/public/live_scanner_data.json
          key: live-scanner-data
