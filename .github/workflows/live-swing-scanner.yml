name: Live Swing Scanner

on:
  schedule:
    - cron: '0 20 * * 1-5'  # Mon-Fri 4:00 PM New York (ET) during DST (EDT)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance lxml html5lib

      - name: Build stock universe
        run: python scripts/build_universe.py

      - name: Run live scanner
        run: python scripts/scan_live.py --universe universe --lookback 3 --hh-lookback 30

      - name: Copy data to dashboard public
        run: cp data/*.json dashboard/public/ 2>/dev/null || true

      - name: Commit live scanner data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard/public/live_scanner_data.json
          git diff --cached --quiet || git commit -m "🔴 Live scanner update [skip ci]"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install & build dashboard
        run: cd dashboard && npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: scan-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
