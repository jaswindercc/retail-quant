name: Live Swing Scanner

on:
  schedule:
    - cron: '0 20 * * 1-5'  # Mon-Fri 4:00 PM EDT
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance lxml html5lib

      - name: Build stock universe
        run: python scripts/build_universe.py

      - name: Run live scanner
        run: python scripts/scan_live.py --universe universe --lookback 3 --hh-lookback 30

      - name: Copy to dashboard public
        run: cp data/live_scanner_data.json dashboard/public/live_scanner_data.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/live_scanner_data.json
          git diff --cached --quiet || git commit -m "chore: refresh live scanner data"
          git push
