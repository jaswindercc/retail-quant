name: Regenerate sim data and deploy

on:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  regenerate:
    if: contains(github.event.issue.title, 'Regenerate sim data')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Generate sim data
        run: python scripts/generate_sim_data.py || true

      - name: Copy data to dashboard public
        run: cp data/*.json dashboard/public/ 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install & build dashboard
        run: cd dashboard && npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: regenerate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
