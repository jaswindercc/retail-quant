name: Live Scanner (Daily)

on:
  # Run Mon-Fri at 10:00 AM Toronto (14:00 UTC in EDT / 15:00 UTC in EST)
  # 10 AM is optimal: opening noise has settled, trends established, signals actionable for rest of day
  schedule:
    - cron: '0 14 * * 1-5'
  # Manual trigger
  workflow_dispatch:
    inputs:
      universe:
        description: 'Stock universe to scan'
        required: false
        default: 'universe'
        type: choice
        options:
          - universe
          - sp500
          - swing

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance lxml html5lib

      - name: Build stock universe (NYSE/NASDAQ/CBOE, >$2)
        run: python scripts/build_universe.py

      - name: Run live scanner (top 3 strategies)
        run: |
          python scripts/scan_live.py --universe ${{ github.event.inputs.universe || 'universe' }} --lookback 3 --hh-lookback 30

      - name: Commit scanner results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard/public/live_scanner_data.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "🔴 Live scanner $(TZ='America/Toronto' date '+%Y-%m-%d %I:%M %p ET')"
          git push
