name: Refresh Scanner Data

on:
  # Run Mon-Fri at 3:15 PM New York (ET)
  schedule:
    - cron: '15 19 * * 1-5'
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner refresh
        run: python scripts/refresh_scanner.py

      - name: Commit updated scanner data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard/public/scanner_data.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "🤖 Scanner refresh $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
          git push
