name: Refresh Scanner Data

on:
  # Run Mon-Fri at 3:20 PM ET (19:20 UTC in EDT / 20:20 UTC in EST)
  schedule:
    - cron: '20 19 * * 1-5'
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner refresh
        run: python scripts/refresh_scanner.py

      - name: Commit updated scanner data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/scanner_data.json
          git add data/
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "🤖 Auto-refresh scanner data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
