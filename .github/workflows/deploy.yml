name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Live Swing Scanner", "Google Sheet Sync to SIM", "Overnight Scanner"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore live scanner data from cache
        uses: actions/cache/restore@v4
        with:
          path: dashboard/public/live_scanner_data.json
          key: live-scanner-data

      - name: Restore sim data from cache
        uses: actions/cache/restore@v4
        with:
          path: dashboard/public/sim_data.json
          key: sim-data

      - name: Restore overnight scanner data from cache
        uses: actions/cache/restore@v4
        with:
          path: dashboard/public/scanner_data.json
          key: overnight-scanner-data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install & build dashboard
        run: cd dashboard && npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
