name: Overnight Scanner

on:
  schedule:
    - cron: '15 20 * * 1-5'  # Mon-Fri 4:15 PM EDT
  workflow_dispatch:

permissions:
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner refresh
        run: python scripts/refresh_scanner.py

      - name: Cache overnight scanner data
        uses: actions/cache/save@v4
        with:
          path: dashboard/public/scanner_data.json
          key: overnight-scanner-data
